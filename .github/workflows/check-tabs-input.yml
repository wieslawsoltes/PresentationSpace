name: Verify native multiline input
on:
  push:
    branches: [work/verify-custom-tabs-input]
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-native-input
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: browser-distribution
          run-id: 36745280083
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/site
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install chromium
      - name: Exercise actual input with detach synchronization
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          shutil.copytree('artifacts/site', 'artifacts/serve/PresentationSpace')
          path = Path('tools/browser-performance.py')
          text = path.read_text()
          old = "        page.keyboard.press('Escape')\n        attr('data-table-text-length', before - old_length + len('Canvas heading\\nSecond line'))"
          new = "        page.keyboard.press('Escape')\n        page.wait_for_function(\"() => document.activeElement?.tagName !== 'TEXTAREA' && document.documentElement.getAttribute('data-focus-id') === 'slide-canvas:SlideViewport'\")\n        page.evaluate(\"() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)))\")\n        attr('data-table-text-length', before - old_length + len('Canvas heading\\nSecond line'))"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          tabs = Path('tools/browser-tabs.py')
          text = tabs.read_text()
          old = "        command('Open custom tabs sample');"
          new = "        page.bring_to_front()\n        attr('data-slide-count', 4)\n        page.wait_for_function(\"document.hasFocus() && document.documentElement.getAttribute('data-focus-id') === 'slide-canvas:SlideViewport'\", timeout=20000)\n" + old
          assert text.count(old) == 1
          tabs.write_text(text.replace(old,new))
          PY
          python -m http.server 8080 --directory artifacts/serve > artifacts/server.log 2>&1 &
          result=0
          python tools/browser-performance.py || result=1
          python tools/browser-tabs.py || result=1
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-input-check
          path: |
            artifacts/screenshots
            artifacts/server.log
