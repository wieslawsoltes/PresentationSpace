name: Integrate typography tests and documentation
on:
  push:
    branches: [work/text-layout-0.7]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'refine-text:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified refinements
        run: |
          set -euo pipefail
          git diff --exit-code b71b172886a9f0c42c3f4316b5c9439238017bee HEAD -- src tests tools docs README.md CHANGELOG.md
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/text-refinement.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'a0163da1d7dae2c6d5c59b40f5b6fcb481d181f7070689813d5884342042fcdc'
          Path('/tmp/text-refinement.patch').write_bytes(patch)
          PY
          git apply --check /tmp/text-refinement.patch
          git apply /tmp/text-refinement.patch
          rm .ci/text-refinement.xz
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: add real-input typography workflows and document shared layout boundaries'
          git push origin HEAD:work/text-layout-0.7
