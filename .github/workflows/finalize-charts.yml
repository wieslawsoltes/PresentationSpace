name: Finalize chart integration
on:
  push:
    branches: [work/chart-authoring-0.3]
permissions:
  contents: write
jobs:
  finalize:
    if: startsWith(github.event.head_commit.message, 'finalize-charts')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply reviewed revision-checked source refinements
        run: |
          set -euo pipefail
          python3 .ci-chart-finalize/code.py
          python3 .ci-chart-finalize/docs.py
          rm .ci-chart-finalize/*
          rmdir .ci-chart-finalize
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(charts): finish readable defaults, chart backgrounds, existing-command integration and documentation'
          git push origin HEAD:work/chart-authoring-0.3
