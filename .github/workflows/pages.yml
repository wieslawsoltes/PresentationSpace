name: Browser and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish Uno WebAssembly application
        run: dotnet publish src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-browserwasm -c Release -p:TargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/PresentationSpace/ -o artifacts/browser
      - name: Prepare Pages distribution
        run: python3 tools/prepare-pages.py artifacts/browser artifacts/site
      - uses: actions/upload-artifact@v4
        with:
          name: browser-distribution
          path: artifacts/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
