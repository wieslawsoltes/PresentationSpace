name: Browser and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Publish Uno WebAssembly application
        run: dotnet publish src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-browserwasm -c Release -p:PresentationTargetFrameworks=net10.0-browserwasm -p:WasmShellWebAppBasePath=/PresentationSpace/ -o artifacts/browser
      - name: Prepare distributions
        run: |
          python3 tools/prepare-pages.py artifacts/browser artifacts/site
          git archive --format=zip -o artifacts/PresentationSpace-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: browser-distribution
          path: artifacts/site
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: artifacts/PresentationSpace-source.zip
      - name: Install Chromium smoke-test tools
        run: |
          python3 -m pip install playwright==1.55.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Browser interaction tests
        run: |
          mkdir -p artifacts/serve
          ln -s "$PWD/artifacts/site" artifacts/serve/PresentationSpace
          python3 -m http.server 8080 --directory artifacts/serve > artifacts/server.log 2>&1 &
          failed=0
          for suite in smoke performance chrome typography text-body tabs pictures gradients; do
            python3 "tools/browser-$suite.py" || failed=1
          done
          # Collect every independent suite's diagnostics, but never deploy if any failed.
          test "$failed" -eq 0
          mkdir -p artifacts/site/screenshots
          cp artifacts/screenshots/*.png artifacts/site/screenshots/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: |
            artifacts/screenshots
            artifacts/server.log
      - name: Pack all six reusable libraries
        run: |
          for project in Core Formats Rendering.Skia Ribbon.Uno Controls.Uno Editor.Uno; do
            dotnet pack "src/PresentationSpace.$project/PresentationSpace.$project.csproj" -c Release -o artifacts/packages
          done
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
