name: Refine performance and canvas editing
on:
  push:
    branches: [work/canvas-performance-0.5]
permissions:
  contents: write
jobs:
  refine:
    if: "startsWith(github.event.head_commit.message, 'refine-performance:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checked source refinement
        run: |
          set -euo pipefail
          git diff --exit-code e5b432c2e665b76ca355055653b6a5dfb3a8f8be HEAD -- src tests Directory.Build.props tools/benchmark-comparison.sh
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          patch=lzma.decompress(Path('.ci/performance-refinement.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '52dac490d52af29a10c7661f0ce23b8c8029f32b05991bc90adc4c7091cfa004'
          Path('/tmp/refine.patch').write_bytes(patch)
          PY
          git apply --check /tmp/refine.patch
          git apply /tmp/refine.patch
          rm .ci/performance-refinement.xz
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bound cache ownership and refine direct-cell navigation and diagnostics'
          git push origin HEAD:work/canvas-performance-0.5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Headless regression tests
        run: dotnet test tests/PresentationSpace.Tests/PresentationSpace.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results
      - name: Compile reusable Uno editor
        run: dotnet build src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-desktop -c Release -p:PresentationTargetFrameworks=net10.0-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-refinement-tests
          path: artifacts/test-results
