name: Integrate chart authoring
on:
  push:
    branches: [work/chart-authoring-0.3]
permissions:
  contents: write
jobs:
  integrate:
    if: startsWith(github.event.head_commit.message, 'integrate-charts')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Integrate exact-baseline source changes
        run: |
          set -euo pipefail
          python3 .ci/apply-charts.py
          rm .ci/apply-charts.py
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate multi-series chart model, renderer, editor and PPTX interchange'
          git push origin HEAD:work/chart-authoring-0.3
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Regression and native chart schema tests
        run: dotnet test tests/PresentationSpace.Tests/PresentationSpace.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results
      - name: Compile Uno desktop editor
        run: dotnet build src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-desktop -c Release -p:PresentationTargetFrameworks=net10.0-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chart-integration-tests
          path: artifacts/test-results
