name: Integrate final text-layout refinements
on:
  push:
    branches: [work/text-layout-0.7]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'final-text:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified font-selector and allocation corrections
        run: |
          set -euo pipefail
          git diff --exit-code c8e96f78389de0f24347ba5ae59ae5afa05eccb8 HEAD -- src tools docs CHANGELOG.md
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/final-text.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'f9774660e174c10c909d5c549adfe1fe494eff5ea5ca62538271b9d174175931'
          Path('/tmp/final-text.patch').write_bytes(patch)
          PY
          git apply --check /tmp/final-text.patch
          git apply /tmp/final-text.patch
          rm .ci/final-text.xz
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: display fitted font sizes accurately and reduce uniform text allocations'
          git push origin HEAD:work/text-layout-0.7
