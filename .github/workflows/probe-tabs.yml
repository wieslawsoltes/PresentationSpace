name: Diagnose native tab input
on:
  push:
    branches: [work/custom-tabs-0.9]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: "startsWith(github.event.head_commit.message, 'test: capture failing native')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: browser-distribution
          run-id: 36713179543
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/site
      - name: Install browser tools
        run: |
          python3 -m pip install playwright==1.55.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Inspect real tab-input behavior
        run: |
          mkdir -p artifacts/serve
          ln -s "$PWD/artifacts/site" artifacts/serve/PresentationSpace
          python3 -m http.server 8080 --directory artifacts/serve > artifacts/server.log 2>&1 &
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/browser-tabs.py')
          text = path.read_text()
          capture = '''        def snapshot(name):
                      state = page.evaluate("() => ({attributes: Object.fromEntries([...document.documentElement.attributes].filter(a => a.name.startsWith('data-')).map(a => [a.name,a.value])), input: {id:document.activeElement?.id,tag:document.activeElement?.tagName,value:document.activeElement?.value,start:document.activeElement?.selectionStart,end:document.activeElement?.selectionEnd}})")
                      (out / (name + '.json')).write_text(json.dumps(state, indent=2))
                  snapshot('tabs-failure-state')
                  if failures:
                      page.mouse.move(1360, 800); page.mouse.wheel(0, 660); page.wait_for_timeout(500)
                      shot('tabs-error-region')
                      page.keyboard.press('Tab'); page.keyboard.press('Enter'); page.wait_for_timeout(500)
                      snapshot('tabs-after-button'); shot('tabs-after-button')
          '''
          text = text.replace("    finally:\n", "    finally:\n" + capture)
          path.write_text(text)
          PY
          python3 tools/browser-tabs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tab-input-probe
          path: artifacts/screenshots
