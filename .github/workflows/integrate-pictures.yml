name: Integrate picture layout
on:
  push:
    branches: [work/picture-layout-0.10]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'integrate-pictures:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified implementation
        run: |
          set -euo pipefail
          git diff --exit-code 77b44a00c052572080774f9f6f26cee731a59033 HEAD -- src tests tools docs README.md CHANGELOG.md Directory.Build.props
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(b''.join(Path(f'.ci/pictures.{i}').read_bytes() for i in range(5)))
          assert hashlib.sha256(patch).hexdigest() == '317f26f6be5a560623cbbb857ad6cb98d33eb97fbd5a5de5773c46c6255aaea8'
          Path('/tmp/pictures.patch').write_bytes(patch)
          PY
          git apply --check /tmp/pictures.patch
          git apply /tmp/pictures.patch
          rm .ci/pictures.*
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: native picture crop, layout and shared media reuse'
          git push origin HEAD:work/picture-layout-0.10
