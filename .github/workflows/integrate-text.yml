name: Integrate text layout implementation
on:
  push:
    branches: [work/text-layout-0.7]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'integrate-text:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified source changes
        run: |
          set -euo pipefail
          git diff --exit-code 42d73dac8e81931ab2f25b095e0aad4cc23207d0 HEAD -- src tests
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/text.0').read_bytes() + Path('.ci/text.1').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '84488a3ceece690b7f796e72e21d7d2c51058426cea76e2a54d6a05c4f9a2271'
          Path('/tmp/text.patch').write_bytes(patch)
          PY
          git apply --check /tmp/text.patch
          git apply /tmp/text.patch
          rm .ci/text.0 .ci/text.1
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .ci
          git commit -m 'feat: shared HarfBuzz text layout, measured fitting and content-preserving slide sizing'
          git push origin HEAD:work/text-layout-0.7
