name: Apply editing refinement
on:
  push:
    branches: [work/powerpoint-fidelity-0.2]
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'apply-editing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply verified-source editing refinements
        run: |
          set -euo pipefail
          test "$(git hash-object src/PresentationSpace.Core/EditorSession.cs)" = 097f6a3373b7a86ad251e51e02032a38cf6d8651
          python3 .ci-editing/apply.py
          rm .ci-editing/apply.py
          rmdir .ci-editing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve rich-text drafts, paragraph formatting and replace-all styles"
          git push origin HEAD:work/powerpoint-fidelity-0.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Regression and interoperability tests
        run: dotnet test tests/PresentationSpace.Tests/PresentationSpace.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results
      - name: Compile reusable Uno editor
        run: dotnet build src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-desktop -c Release -p:PresentationTargetFrameworks=net10.0-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editing-test-results
          path: artifacts/test-results
