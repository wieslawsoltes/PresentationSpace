name: Finalize canvas navigation and performance documentation
on:
  push:
    branches: [work/canvas-performance-0.5]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'finalize-performance:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified-source refinements
        run: |
          set -euo pipefail
          git diff --exit-code bf42fe57fb9e0ca72d833bebda7827b1a46db1de HEAD -- src tests tools README.md CHANGELOG.md docs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, lzma
          patch = lzma.decompress(Path('.ci/docs.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '02f7b02fbc61e49f1166405e35cd86f84d85f6f8c5f79755f747fb1bd39dd9a2'
          Path('/tmp/docs.patch').write_bytes(patch)
          PY
          git apply --check /tmp/docs.patch
          git apply /tmp/docs.patch
          python3 .ci/focus.py
          rm .ci/docs.xz .ci/focus.py
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: handle table Tab navigation before focus traversal and document measured performance'
          git push origin HEAD:work/canvas-performance-0.5
