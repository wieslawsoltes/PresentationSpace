name: Apply fidelity implementation
on:
  push:
    branches: [work/powerpoint-fidelity-0.2]
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'apply-fidelity')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Apply exact-baseline implementation
        run: |
          set -euo pipefail
          test "$(git hash-object src/PresentationSpace.Core/EditorSession.cs)" = 35094786318bee4cb63fce65f254f9503ee8d364
          test "$(git hash-object src/PresentationSpace.Formats/PptxCodec.cs)" = dfde1d1b2209d56245ff8e8629ae8485094c6db4
          git apply --check --unidiff-zero .ci-fidelity/*.patch
          git apply --unidiff-zero .ci-fidelity/*.patch
          python3 .ci-fidelity/apply-formats.py
          python3 .ci-fidelity/apply-ui.py
          rm .ci-fidelity/*
          rmdir .ci-fidelity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve layouts and rich text, export native tables and chart workbooks"
          git push origin HEAD:work/powerpoint-fidelity-0.2
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate implementation
        run: dotnet test tests/PresentationSpace.Tests/PresentationSpace.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-test-results
          path: artifacts/test-results
