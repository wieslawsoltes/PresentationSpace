name: Integrate paragraph and text-body layout
on:
  push:
    branches: [work/text-body-layout-0.8]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'integrate-body:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified implementation
        run: |
          set -euo pipefail
          git diff --exit-code 2044ea15a92ed4384c685a9ea73dd85b850811a6 HEAD -- src tests Directory.Build.props
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/body.0').read_bytes() + Path('.ci/body.1').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'fecd6c838432a8cea12d3c93a5587f8ed0ee2eaee9cba22429b1ccb45385e95f'
          Path('/tmp/body.patch').write_bytes(patch)
          PY
          git apply --check /tmp/body.patch
          git apply /tmp/body.patch
          rm .ci/body.0 .ci/body.1
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: paragraph spacing, indentation, justification and editable text-body insets'
          git push origin HEAD:work/text-body-layout-0.8
