name: Integrate multiline input correction
on:
  push:
    branches: [work/custom-tabs-0.9]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'fix-multiline:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified input corrections
        run: |
          set -euo pipefail
          git diff --exit-code d29f5572bb992d364e797e77dc1d8f49f51cff86 HEAD -- src tests tools docs README.md CHANGELOG.md Directory.Build.props
          python3 - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/multiline.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'fa184d85f0ddaa49a2f70c1015a7ac300bc25b7cb4dfdb233575623d782db1ea'
          Path('/tmp/multiline.patch').write_bytes(patch)
          PY
          git apply --check /tmp/multiline.patch
          git apply /tmp/multiline.patch
          rm .ci/multiline.xz
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve multiline content, native tab definitions and normalized text styles'
          git push origin HEAD:work/custom-tabs-0.9
