name: Integrate compact tab metadata
on:
  push:
    branches: [work/custom-tabs-0.9]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'optimize-tabs:')"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified allocation correction
        run: |
          set -euo pipefail
          git diff --exit-code 81717940ffc6df59b21ff7bfc6d0ad1a2552165e HEAD -- src docs
          python - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/tabs-allocation.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'df80e68f973f510d4a2e996d0b39586fd7139bdce2fd1300d8c1c722ef86c0c6'
          Path('tabs-allocation.patch').write_bytes(patch)
          PY
          git apply --check tabs-allocation.patch
          git apply tabs-allocation.patch
          rm .ci/tabs-allocation.xz tabs-allocation.patch
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: store aligned-tab metadata only on tab pieces, not every shaping probe'
          git push origin HEAD:work/custom-tabs-0.9
