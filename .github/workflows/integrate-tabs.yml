name: Integrate custom tab layout
on:
  push:
    branches: [work/custom-tabs-0.9]
permissions:
  contents: write
concurrency:
  group: integrate-tabs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'integrate-tabs:')"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-verified implementation
        run: |
          set -euo pipefail
          git diff --exit-code 24b4799cdab540f9f754198b3b56a4a547ad36a4 HEAD -- src tests tools docs README.md CHANGELOG.md Directory.Build.props
          python - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/tabs.0').read_bytes() + Path('.ci/tabs.1').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '8f5a522bf687b7c1c30c3041c7f828a2ac068df318c6f993401b82550d31e030'
          Path('tabs.patch').write_bytes(patch)
          patch = lzma.decompress(Path('.ci/tabs-refine.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '91d65f0b9aaf388d2160891b7fb84616d6d59c5dbd7a74498830c034a383e302'
          Path('tabs-refine.patch').write_bytes(patch)
          PY
          git apply --check tabs.patch
          git apply tabs.patch
          git apply --check tabs-refine.patch
          git apply tabs-refine.patch
          rm .ci/tabs.0 .ci/tabs.1 .ci/tabs-refine.xz tabs.patch tabs-refine.patch
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: aligned custom text tabs, safe delayed inspector edits and native preservation'
          git push origin HEAD:work/custom-tabs-0.9
