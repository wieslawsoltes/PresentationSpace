name: Integrate tab-default corrections
on:
  push:
    branches: [work/custom-tabs-0.9]
permissions:
  contents: write
jobs:
  integrate:
    if: "startsWith(github.event.head_commit.message, 'fix-tab-defaults:')"
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply verified corrections
        run: |
          set -euo pipefail
          git diff --exit-code d2b2ae272f8ea0c02b09141adc3c6103f99f8211 HEAD -- src tests
          python - <<'PY'
          import hashlib, lzma
          from pathlib import Path
          patch = lzma.decompress(Path('.ci/tabs-validation.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '8aee49e41b94e87d25f2269a5343ddffc2c85bc22ecb93ee8671fd4a3f94c068'
          Path('tabs-validation.patch').write_bytes(patch)
          PY
          git apply --check tabs-validation.patch
          git apply tabs-validation.patch
          rm .ci/tabs-validation.xz tabs-validation.patch
          rmdir .ci
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: resolve default tab lists and validate interchange values independently of array identity'
          git push origin HEAD:work/custom-tabs-0.9
