name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Test and desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unit, rendering and interoperability tests
        env:
          RENDER_DIAGNOSTICS: ${{ github.workspace }}/artifacts/render-diagnostics
        run: dotnet test tests/PresentationSpace.Tests/PresentationSpace.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results
      - name: Same-runner CPU and raster benchmarks
        if: runner.os == 'Linux'
        run: bash tools/benchmark-comparison.sh
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: performance-comparison
          path: artifacts/performance
      - name: Build native desktop app
        run: dotnet build src/PresentationSpace.App/PresentationSpace.App.csproj -f net10.0-desktop -c Release -p:PresentationTargetFrameworks=net10.0-desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/render-diagnostics
